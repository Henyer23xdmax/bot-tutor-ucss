# fly.toml app configuration file generated for bot-tutor-ucss on 2026-08-31T21:46:36Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'bot-tutor-ucss'
primary_region = 'iad'

[build]
  builder = 'paketobuildpacks/builder:base'

[env]
  PORT = '8080'

[http_service]
  auto_start_machines = true
  auto_stop_machines = 'stop'
  force_https = false
  internal_port = 8080
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
  memory_mb = 1024
